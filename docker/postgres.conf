# Postgres tuned so the demo has something to show, not for production.
#
# This file replaces the image's own postgresql.conf, so it has to say everything the
# container needs — starting with listening on more than the loopback interface.
listen_addresses = '*'

#
# pg_stat_statements is the one setting Momus genuinely needs from you: it is what
# turns "the database is slow" into "these five statements are the reason".
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 5000

# Deliberately small, so a sequential scan over 60,000 products actually evicts hot
# pages and the buffer cache hit ratio moves. On a real server this would be gigabytes.
shared_buffers = 32MB

# Low enough that the "hold 30 connections" scenario reaches the saturation threshold.
max_connections = 40

# Track what the checks read.
track_activities = on
track_counts = on
track_io_timing = on
