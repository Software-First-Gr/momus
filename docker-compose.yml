# The whole thing, on one command:
#
#   docker compose up --build
#
#   http://localhost:8080   the demo shop — press buttons, generate load
#   http://localhost:4848   Momus — what the database makes of it
#
# Nothing else to install and nothing to configure: the shop seeds its own data and
# Momus finds the database through MOMUS_TARGETS__0__*.

name: momus

services:
  db:
    image: postgres:18-alpine
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    volumes:
      - ./docker/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      # Postgres 18 wants the whole directory mounted, not just data/ inside it.
      - db-data:/var/lib/postgresql
    ports:
      # Host port 55432 so this never fights with a Postgres you already run on 5432.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  momus:
    build:
      context: .
      dockerfile: src/Momus.Cli/Dockerfile
    environment:
      MOMUS_TARGETS__0__NAME: shop
      MOMUS_TARGETS__0__PROVIDER: postgres
      MOMUS_TARGETS__0__CONNECTIONSTRING: Host=db;Port=5432;Username=postgres;Password=postgres;Database=shop
      MOMUS_SCAN_INTERVAL: 30s
    volumes:
      - momus-data:/data
    ports:
      - "4848:4848"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  shop:
    build:
      context: .
      dockerfile: samples/Shop.Api/Dockerfile
    environment:
      ConnectionStrings__Shop: Host=db;Port=5432;Username=postgres;Password=postgres;Database=shop;Maximum Pool Size=20
      # Where the browser can reach Momus, for the link in the demo's header.
      MomusUrl: http://localhost:4848
      # Start with traffic already running, so Momus has something to find by the time you look.
      Traffic: light
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  momus-data:
