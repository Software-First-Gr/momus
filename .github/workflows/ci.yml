name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Momus.Client ships for three majors and Momus.Client.Tests runs against all three. The
      # SDK builds them either way; the 8 and 9 runtimes are what lets the test hosts run on the
      # runtime they target instead of rolling forward, which is the other half of the claim.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output artifacts -p:ContinuousIntegrationBuild=true

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*nupkg

  # The Docker image is the same binary as the dotnet tool, with `serve` as its default command.
  # edge follows develop; a v* tag publishes semver plus latest (decision D8).
  image:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/software-first-gr/momus
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Momus.Cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    # NuGet Trusted Publishing: this job requests a GitHub OIDC token, which
    # nuget.org exchanges for a one-hour API key. No long-lived secret is stored.
    # Requires a Trusted Publishing policy on nuget.org for this repo + workflow,
    # and a NUGET_USER repository secret holding the nuget.org owner name.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Momus.Client ships for three majors and Momus.Client.Tests runs against all three. The
      # SDK builds them either way; the 8 and 9 runtimes are what lets the test hosts run on the
      # runtime they target instead of rolling forward, which is the other half of the claim.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack (version from tag)
        run: dotnet pack --configuration Release --output artifacts -p:Version=${GITHUB_REF_NAME#v} -p:ContinuousIntegrationBuild=true

      - name: NuGet login (OIDC exchanged for a short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
